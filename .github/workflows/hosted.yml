name: Hosted Todo journey
# Runs the synthetic central sign-in journey against the protected Todo
# preview after each successful preview deployment of the registered branch,
# or on demand.
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-todo
  cancel-in-progress: false
jobs:
  target:
    # Decides whether this deployment is the registered branch's head. It has
    # no environment, so other branches' previews skip instead of failing the
    # environment's branch policy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    # Light and secret-free, so it runs on the self-hosted Mac (no lane);
    # CI_RUNNER=hosted moves it back to ubuntu-latest.
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","royer-ci"]') }}
    timeout-minutes: 2
    outputs:
      run: ${{ steps.target.outputs.run }}
    steps:
      - id: target
        env:
          BRANCH: ${{ vars.TODO_PREVIEW_BRANCH }}
          TODO_PREVIEW_URL: ${{ vars.TODO_PREVIEW_URL }}
          DEPLOYED: ${{ github.event.deployment.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BRANCH" ] || [ -z "$TODO_PREVIEW_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "TODO_PREVIEW_BRANCH or TODO_PREVIEW_URL is not set."; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$REPOSITORY/branches/$BRANCH" --jq .commit.sha 2>/dev/null || true)
          if [ "$head" = "$DEPLOYED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Deployment $DEPLOYED is not the head of $BRANCH."; fi
  hosted:
    needs: target
    if: needs.target.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live on this branch-limited environment, not the repository.
    environment: hosted-preview
    env:
      TODO_PREVIEW_URL: ${{ vars.TODO_PREVIEW_URL }}
    steps:
      - name: Wait for the registered origin to serve this deployment
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.TODO_PREVIEW_BYPASS }}
        run: |
          [[ "$DEPLOYMENT_URL" =~ ^https://todo-[a-z0-9]+-royer-adames-projects\.vercel\.app$ ]] || { echo "Unexpected deployment URL."; exit 1; }
          id() { curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$1/" | grep -o 'data-dpl-id="[^"]*"' | head -1; }
          want=$(id "$DEPLOYMENT_URL")
          test -n "$want"
          for attempt in $(seq 1 30); do
            [ "$(id "$TODO_PREVIEW_URL")" = "$want" ] && exit 0
            sleep 10
          done
          echo "The registered origin never served this deployment."; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosted
        env:
          PLAYWRIGHT_CHANNEL: chromium
          TODO_PREVIEW_BYPASS: ${{ secrets.TODO_PREVIEW_BYPASS }}
          ACCOUNTS_PREVIEW_BYPASS: ${{ secrets.ACCOUNTS_PREVIEW_BYPASS }}
          AUTH_PREVIEW_SINK_TOKEN: ${{ secrets.AUTH_PREVIEW_SINK_TOKEN }}
      - name: Remove synthetic accounts
        if: always()
        run: node scripts/cleanup-hosted-accounts.mjs
        env:
          TODO_DATABASE_URL: ${{ secrets.TODO_DATABASE_URL }}
          ISSUER_DATABASE_URL: ${{ secrets.ISSUER_DATABASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hosted-todo-results
          path: |
            test-results-hosted/**/*.png
            test-results-hosted/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
